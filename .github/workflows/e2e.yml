name: E2E

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build server
        run: go build -o naturieux ./cmd/server

      - name: Start server (mock data, open registration)
        run: |
          DEV_MODE=1 PORT=8090 REGISTRATION_MODE=open \
            AUTH_SECRET=e2e-secret DB_PATH=$RUNNER_TEMP/e2e.db \
            ./naturieux &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8090/health && break
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E
        env:
          BASE_URL: http://localhost:8090
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
