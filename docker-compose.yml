services:
  naturieux:
    build: .
    image: naturieux:latest
    container_name: naturieux
    ports:
      - "8080:8080"
    environment:
      # Set DEV_MODE=1 to use mock data instead of the iNaturalist API
      DEV_MODE: "${DEV_MODE:-0}"
      PORT: "8080"
      DB_PATH: "/data/naturieux.db"
      # Species source. Leave empty to auto-detect: the local TAXREF as soon
      # as it is imported, otherwise iNaturalist. Force with taxref | inat | mock.
      SPECIES_SOURCE: "${SPECIES_SOURCE:-}"
      # Admin back-office (set both to enable the /admin account)
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      AUTH_SECRET: "${AUTH_SECRET:-}"
      # Optional one-time data bootstrap on first run (downloads + imports, then
      # never again). Photos/sounds remain curator-added. The occurrence file
      # can be very large.
      BOOTSTRAP_TAXREF_URL: "${BOOTSTRAP_TAXREF_URL:-}"
      BOOTSTRAP_OCCURRENCES_URL: "${BOOTSTRAP_OCCURRENCES_URL:-}"
      # Media storage: local (default, on the /data volume) or s3.
      # For S3/MinIO set STORAGE=s3 and the S3_* variables below.
      STORAGE: "${STORAGE:-local}"
      MEDIA_DIR: "/data/media"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"
    volumes:
      - naturieux-data:/data
    restart: unless-stopped

  # Optional MinIO object storage (S3-compatible). Enable with:
  #   docker compose --profile minio up
  # then point the app at it:
  #   STORAGE=s3 S3_ENDPOINT=minio:9000 S3_BUCKET=naturieux \
  #   S3_ACCESS_KEY=naturieux S3_SECRET_KEY=naturieux-secret \
  #   S3_PUBLIC_URL=http://localhost:9000/naturieux docker compose --profile minio up
  minio:
    image: minio/minio:latest
    container_name: naturieux-minio
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-naturieux}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-naturieux-secret}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: create the bucket and make it publicly readable so the served
  # photo URLs work without signing.
  minio-init:
    image: minio/mc:latest
    container_name: naturieux-minio-init
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-naturieux} ${S3_SECRET_KEY:-naturieux-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-naturieux} &&
      mc anonymous set download local/${S3_BUCKET:-naturieux} &&
      echo 'MinIO bucket ready';
      "
    restart: "no"

  # Optional HTTPS reverse proxy (automatic Let's Encrypt certificates).
  # Enable with:  NATURIEUX_DOMAIN=your-domain.fr docker compose --profile tls up -d
  # The domain's DNS must point at this host and ports 80/443 be reachable.
  caddy:
    image: caddy:2-alpine
    container_name: naturieux-caddy
    profiles: ["tls"]
    depends_on:
      - naturieux
    ports:
      - "80:80"
      - "443:443"
    environment:
      NATURIEUX_DOMAIN: "${NATURIEUX_DOMAIN:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  naturieux-data:
  minio-data:
  caddy-data:
  caddy-config:
