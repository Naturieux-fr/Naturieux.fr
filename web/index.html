<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naturieux - Quiz Naturaliste</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
</head>
<body>
    <div class="app" x-data="quizApp()">
        <!-- Dev Mode Indicator -->
        <div x-show="devMode" class="dev-mode-badge">
            🔧 DEV MODE
        </div>

        <!-- Home Screen -->
        <section x-show="screen === 'home'" x-transition class="screen">
            <header class="hero">
                <div class="logo">
                    <span class="logo-icon">🌿</span>
                    <h1>Naturieux</h1>
                </div>
                <p class="tagline">Testez vos connaissances sur la nature</p>
            </header>

            <div class="menu-container">
                <div class="player-info">
                    <div class="avatar">🦊</div>
                    <div class="player-details">
                        <span class="player-name" x-text="player.name">Joueur</span>
                        <span class="player-level">Niveau <span x-text="player.level">1</span></span>
                    </div>
                    <div class="player-xp">
                        <div class="xp-bar">
                            <div class="xp-fill" :style="`width: ${player.xpPercent}%`"></div>
                        </div>
                        <span class="xp-text" x-text="`${player.xp} / ${player.xpNext} XP`">0 / 100 XP</span>
                    </div>
                </div>

                <div class="game-options">
                    <h2>Nouvelle Partie</h2>

                    <div class="option-group">
                        <label>Difficulte</label>
                        <div class="difficulty-selector">
                            <template x-for="diff in difficulties" :key="diff.id">
                                <button class="diff-btn"
                                        :class="{ 'active': settings.difficulty === diff.id }"
                                        @click="settings.difficulty = diff.id">
                                    <span class="diff-icon" x-text="diff.icon"></span>
                                    <span class="diff-name" x-text="diff.name"></span>
                                    <span class="diff-desc" x-text="diff.desc"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <div class="option-group">
                        <label>Categorie</label>
                        <div class="category-selector">
                            <template x-for="cat in categories" :key="cat.id">
                                <button class="cat-btn"
                                        :class="{ 'active': settings.taxon === cat.id }"
                                        @click="settings.taxon = cat.id">
                                    <span x-text="cat.icon"></span>
                                    <span x-text="cat.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <div class="option-group">
                        <label>Nombre de questions</label>
                        <div class="question-count-selector">
                            <template x-for="count in [5, 10, 15, 20]" :key="count">
                                <button class="count-btn"
                                        :class="{ 'active': settings.questionCount === count }"
                                        @click="settings.questionCount = count"
                                        x-text="count">
                                </button>
                            </template>
                        </div>
                    </div>

                    <button @click="startGame()" class="primary-btn" :disabled="loading">
                        <span x-show="!loading">Commencer</span>
                        <span x-show="loading" class="loader-small"></span>
                        <span class="btn-icon">→</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Quiz Screen -->
        <section x-show="screen === 'quiz'" x-transition class="screen">
            <header class="quiz-header">
                <div class="quiz-progress">
                    <span x-text="`${currentQuestion}/${totalQuestions}`">1/10</span>
                    <div class="progress-bar">
                        <div class="progress-fill" :style="`width: ${(currentQuestion/totalQuestions)*100}%`"></div>
                    </div>
                </div>
                <div class="quiz-stats">
                    <div class="stat">
                        <span class="stat-icon">🔥</span>
                        <span x-text="streak">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-icon">⭐</span>
                        <span x-text="score">0</span>
                    </div>
                </div>
                <button @click="quitGame()" class="icon-btn" title="Quitter">✕</button>
            </header>

            <div class="quiz-content">
                <div class="timer-container" x-data="{ circumference: 2 * Math.PI * 45 }">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-bg" cx="50" cy="50" r="45"/>
                        <circle class="timer-progress" cx="50" cy="50" r="45"
                                :stroke-dasharray="circumference"
                                :stroke-dashoffset="circumference * (1 - timer/timeLimit)"
                                :class="{ 'timer-warning': timer <= 5 }"/>
                    </svg>
                    <span class="timer-text" x-text="timer" :class="{ 'timer-warning': timer <= 5 }"></span>
                </div>

                <div class="question-container">
                    <div class="image-container">
                        <img :src="question.mediaUrl || null" alt="Identifiez cette espece"
                             x-show="question.mediaUrl"
                             @load="onImageLoad()"
                             @error="onImageError()"
                             :class="{ 'loaded': imageLoaded }">
                        <div class="image-loader" x-show="!imageLoaded">
                            <div class="loader-spinner"></div>
                            <p x-show="timerPaused" class="loading-text">Chargement de l'image...</p>
                        </div>
                    </div>
                    <p class="photo-credit" x-show="question.mediaAttribution" x-text="question.mediaAttribution"></p>
                </div>

                <div class="choices-container">
                    <template x-for="choice in question.choices" :key="choice.species_id">
                        <button class="choice-btn"
                                :class="{
                                    'selected': selectedAnswer === choice.species_id,
                                    'correct': showFeedback && choice.species_id === correctAnswer,
                                    'wrong': showFeedback && selectedAnswer === choice.species_id && choice.species_id !== correctAnswer,
                                    'disabled': showFeedback
                                }"
                                @click="submitAnswer(choice.species_id)"
                                :disabled="showFeedback">
                            <span x-text="choice.display_name"></span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Feedback Overlay -->
            <div class="feedback-overlay" x-show="showFeedback" x-transition.opacity>
                <div class="feedback-card" :class="isCorrect ? 'correct' : 'wrong'">
                    <div class="feedback-icon" x-text="isCorrect ? '✓' : '✗'"></div>
                    <h3 x-text="isCorrect ? 'Correct!' : 'Incorrect'"></h3>
                    <p x-text="feedbackText"></p>
                    <div class="feedback-score" x-show="isCorrect">
                        +<span x-text="lastScore"></span> points
                    </div>
                    <button @click="nextQuestion()" class="primary-btn">
                        <span x-text="sessionComplete ? 'Voir les resultats' : 'Question suivante'"></span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Results Screen -->
        <section x-show="screen === 'results'" x-transition class="screen">
            <div class="results-container">
                <div class="results-header">
                    <div class="trophy" x-text="getTrophy()">🏆</div>
                    <h2>Partie terminee!</h2>
                    <div class="final-score">
                        <span class="score-label">Score final</span>
                        <span class="score-value" x-text="score">0</span>
                    </div>
                </div>

                <div class="results-stats">
                    <div class="result-stat">
                        <span class="result-icon">✓</span>
                        <span class="result-value" x-text="correctCount">0</span>
                        <span class="result-label">Bonnes reponses</span>
                    </div>
                    <div class="result-stat">
                        <span class="result-icon">📊</span>
                        <span class="result-value" x-text="`${accuracy.toFixed(0)}%`">0%</span>
                        <span class="result-label">Precision</span>
                    </div>
                    <div class="result-stat">
                        <span class="result-icon">🔥</span>
                        <span class="result-value" x-text="bestStreak">0</span>
                        <span class="result-label">Meilleure serie</span>
                    </div>
                </div>

                <div class="xp-gained">
                    <span class="xp-icon">✨</span>
                    <span>+<span x-text="xpGained">0</span> XP gagnes!</span>
                </div>

                <div class="results-actions">
                    <button @click="playAgain()" class="primary-btn">Rejouer</button>
                    <button @click="goHome()" class="secondary-btn">Menu principal</button>
                </div>
            </div>
        </section>

        <!-- Loading Overlay -->
        <div class="loading-overlay" x-show="loading" x-transition.opacity>
            <div class="loader">
                <div class="loader-spinner"></div>
                <p>Chargement...</p>
            </div>
        </div>

        <!-- Error Toast -->
        <div class="toast" x-show="error" x-transition
             @click="error = ''"
             x-text="error">
        </div>
    </div>

    <script src="/static/js/app.js?v=1.1"></script>
</body>
</html>
