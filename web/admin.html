<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naturieux — Cabinet de conservation</title>
    <link rel="icon" href="/static/img/favicon.svg?v=1" type="image/svg+xml"><path d=%22M16 28V11%22 fill=%22none%22 stroke=%22%2324402c%22 stroke-width=%222%22/><path d=%22M16 19c-5 0-8-3-8-8 5 0 8 3 8 8ZM16 16c4 0 6.5-2.6 6.5-6.5C18.5 9.5 16 12 16 16Z%22 fill=%22%2324402c%22/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=3.0">
    <link rel="stylesheet" href="/static/css/admin.css?v=2.1">
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js" integrity="sha384-Rpe/8orFUm5Q1GplYBHxbuA8Az8O8C5sAoOsdbRWkqPjKFaxPgGZipj4zeHL7lxX" crossorigin="anonymous"></script>
</head>
<body>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="screen admin" x-data="adminApp()" x-init="init()">

        <!-- Connexion -->
        <article class="plate adm-login reveal" style="--d:0" x-show="!token">
            <div class="emblem" aria-hidden="true">
                <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" class="seal-ring"/><circle cx="32" cy="32" r="25" class="seal-ring thin"/><path d="M32 50V28" class="stem"/><path d="M32 42c-8 0-13-5-13-13 8 0 13 5 13 13Z" class="leaf"/><path d="M32 37c6.5 0 10.5-4 10.5-10.5C36 26.5 32 30.5 32 37Z" class="leaf"/></svg>
            </div>
            <h1 class="plate-title">Cabinet de conservation</h1>
            <p class="plate-lead">Accès réservé au conservateur.</p>
            <input type="text" class="ink-field block" x-model="login.username" placeholder="Identifiant" @keyup.enter="doLogin()">
            <input type="password" class="ink-field block" x-model="login.password" placeholder="Mot de passe" @keyup.enter="doLogin()">
            <button @click="doLogin()" class="btn btn-solid btn-lg" :disabled="busy">Entrer</button>
            <p class="adm-error" x-show="error" x-text="error"></p>
        </article>

        <!-- Console -->
        <div x-show="token">
            <header class="adm-head reveal" style="--d:0">
                <div class="adm-brand">
                    <span class="adm-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 28V11" class="stem"/><path d="M16 19c-5 0-8-3-8-8 5 0 8 3 8 8Z" class="leaf"/></svg></span>
                    <h1>Conservation des planches</h1>
                </div>
                <button @click="logout()" class="btn btn-quiet adm-out">Quitter</button>
            </header>

            <p class="adm-error" x-show="error" x-text="error"></p>

            <!-- Invitations -->
            <article class="plate reveal" style="--d:1">
                <span class="plate-no">✦</span>
                <h2 class="plate-title">Inviter un naturaliste</h2>
                <p class="plate-lead">Générez un lien d'inscription à envoyer (valable 14 jours).</p>
                <button @click="generateInvite()" class="btn btn-solid">Générer un lien d'invitation</button>
                <div class="invite-out" x-show="inviteLink" style="margin-top:14px">
                    <input type="text" class="ink-field" :value="inviteLink" readonly @focus="$event.target.select()">
                    <button @click="copyInvite()" class="btn btn-quiet" style="margin-top:8px">Copier le lien</button>
                </div>
            </article>

            <!-- Recherche -->
            <article class="plate reveal" style="--d:2">
                <span class="plate-no">I</span>
                <h2 class="plate-title">Trouver une espèce</h2>
                <div class="field-row">
                    <input type="text" class="ink-field" x-model="search.query"
                           placeholder="Nom scientifique ou français (ex. Vulpes, Renard)" @keyup.enter="doSearch()">
                    <button @click="doSearch()" class="btn btn-quiet" :disabled="busy">Rechercher</button>
                </div>

                <ul class="find-list" x-show="search.results.length">
                    <template x-for="t in search.results" :key="t.cd_nom">
                        <li class="find-item" :class="{ active: selected && selected.cd_nom === t.cd_nom }" @click="select(t)">
                            <span class="find-names">
                                <em x-text="t.scientific_name"></em>
                                <span x-text="t.vernacular_name"></span>
                            </span>
                            <span class="find-cd" x-text="'cd_nom ' + t.cd_nom"></span>
                        </li>
                    </template>
                </ul>
            </article>

            <!-- Planches du taxon -->
            <article class="plate reveal" style="--d:2" x-show="selected">
                <span class="plate-no">II</span>
                <h2 class="plate-title">
                    Planches de <em x-text="selected ? selected.scientific_name : ''"></em>
                </h2>
                <p class="plate-lead" x-show="selected" x-text="selected ? 'cd_nom ' + selected.cd_nom : ''"></p>

                <div class="photo-rows" x-show="photos.length">
                    <template x-for="p in photos" :key="p.id">
                        <div class="photo-row">
                            <img class="photo-mini" :src="p.url" alt="" loading="lazy">
                            <span class="photo-link" x-text="p.url"></span>
                            <span class="photo-diff" x-text="p.difficulty || '—'"></span>
                            <button class="btn-trash" @click="removePhoto(p.id)" title="Retirer">✕</button>
                        </div>
                    </template>
                </div>
                <p class="empty-note" x-show="!photos.length">Aucune planche pour cette espèce.</p>

                <h3 class="adm-sub">Ajouter une planche</h3>
                <div class="source-toggle">
                    <button class="toggle-btn" :class="{ active: form.mode === 'upload' }" @click="form.mode = 'upload'">Déposer un fichier</button>
                    <button class="toggle-btn" :class="{ active: form.mode === 'url' }" @click="form.mode = 'url'">Lien externe</button>
                </div>

                <div class="photo-form">
                    <template x-if="form.mode === 'upload'">
                        <div class="drop-zone">
                            <input type="file" accept="image/*" @change="onFile($event)">
                            <img class="drop-preview" x-show="form.preview" :src="form.preview" alt="">
                        </div>
                    </template>
                    <template x-if="form.mode === 'url'">
                        <input type="url" class="ink-field block" x-model="form.url" placeholder="URL de la photo">
                    </template>

                    <input type="text" class="ink-field block" x-model="form.attribution" placeholder="Attribution (auteur, licence)">
                    <input type="text" class="ink-field block" x-model="form.license" placeholder="Code licence (ex. cc-by)">
                    <select class="ink-select" x-model="form.difficulty">
                        <option value="">Difficulté (optionnel)</option>
                        <option value="beginner">Apprenti</option>
                        <option value="intermediate">Amateur</option>
                        <option value="expert">Expert</option>
                        <option value="master">Maître</option>
                    </select>
                    <button @click="submitPhoto()" class="btn btn-solid" :disabled="busy">Ajouter au cabinet</button>
                </div>
            </article>
        </div>
    </div>

    <script src="/static/js/admin.js?v=2.1"></script>
</body>
</html>
